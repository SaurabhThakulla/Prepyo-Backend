services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prepyo-api
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://prepyo:prepyo_pass@postgres:5432/prepyo_db?sslmode=disable}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://codecraftapi.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      CODE_CRAFT: ${CODE_CRAFT:-}
      AI_AUDIO_BASE_URL: ${AI_AUDIO_BASE_URL:-}
      AI_AUDIO_API_KEY: ${AI_AUDIO_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@prepyo.online}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      SESSION_TTL: ${SESSION_TTL:-336h}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prepyo-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: prepyo-postgres
    # Local development only: bound to this machine, so the default password
    # never faces a network. The root docker-compose.yml is the deploy file.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prepyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prepyo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-prepyo_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prepyo} -d ${POSTGRES_DB:-prepyo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prepyo-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  prepyo-net:
    driver: bridge
